<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Brasil - Entrar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo" class="logo">
    </header>

    <main class="login-container">
        <section class="login-card">
            <h1>Entrar</h1>
            <form>
                <div class="input-group">
                    <input type="email" required>
                    <label>Email ou número de telefone</label>
                </div>
                <div class="input-group">
                    <input type="password" required>
                    <label>Senha</label>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
                
                <div class="form-help">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Lembre-se de mim</label>
                    </div>
                    <a href="#">Precisa de ajuda?</a>
                </div>
            </form>

            <div class="card-footer">
                <p>Novo por aqui? <a href="#">Assine agora.</a></p>
                <small>
                    Esta página é protegida pelo Google reCAPTCHA para garantir que você não é um robô. 
                    <a href="#">Saiba mais.</a>
                </small>
            </div>
        </section>
    </main>
</body>
</html>
